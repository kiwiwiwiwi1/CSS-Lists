<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ตัวอย่าง CSS Lists</title>

    <style>
        /* CSS Lists */
        ul.css-list {
            list-style-type: square;   /* เปลี่ยนสัญลักษณ์หน้ารายการ */
            list-style-position: inside; /* จุดอยู่ด้านใน */
            background-color: #f2f2f2;
            padding: 15px;
            width: 300px;
        }

        ul.css-list li {
            color: #333;
            padding: 5px 0;
        }
    </style>
</head>
<body>

    <h1>CSS Lists</h1>
    <p>ตัวอย่างการตกแต่งรายการ (List) ด้วย CSS</p>

    <ul class="css-list">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ul>

</body>
</html>
